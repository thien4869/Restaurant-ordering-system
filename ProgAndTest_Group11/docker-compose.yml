services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: restaurant
      DB_USER: root
      DB_PASS: root
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: restaurant
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
